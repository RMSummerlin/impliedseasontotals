<script>
(function(){
  "use strict";

  /* ===== CONFIG ===== */
  // Injected at build time. Empty = run purely on the pre-rendered lines above.
  var DATA_URL = "__DATA_URL__";

  var DATA = __SEED__;

  var ROOT   = document.getElementById("ptRoot");
  var TABS   = document.getElementById("ptTabs");
  var BODY   = document.getElementById("ptBody");        // season tbody
  var TABLE  = document.getElementById("ptTable");       // season table
  var WBODY  = document.getElementById("ptWeekBody");    // week tbody
  var WTABLE = document.getElementById("ptWeekTable");
  var CARDS  = document.getElementById("ptCards");
  var PANES  = {
    week:   document.getElementById("ptPaneWeek"),
    games:  document.getElementById("ptPaneGames"),
    season: document.getElementById("ptPaneSeason")
  };

  var tab = "__DEFAULT_TAB__";
  var seasonKey = "__SEASON_KEY__";           // "ppg" or "ppg_rest"
  var sortKey = seasonKey, sortDir = -1;      // season table
  var wSortKey = "implied", wSortDir = -1;    // week table
  var openTeam = null;                        // season expansion
  var openWeekTeam = null;                    // week expansion

  function fmt(n){ return (Math.round(n*10)/10).toFixed(1); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function sgn(n){ return (n>0?"+":"") + fmt(n); }
  function has(){ return !!(DATA.week && DATA.week.games && DATA.week.games.length); }

  /* ---- heat ramp: low = slate gray, high = Sharp red ---- */
  var LO = 16, HI = 30;
  function heat(v){
    var t = Math.max(0, Math.min(1, (v - LO) / (HI - LO)));
    var a = [154,167,178], b = [204,0,0];               // #9aa7b2 -> #cc0000
    var c = a.map(function(x,i){ return Math.round(x + (b[i]-x)*t); });
    return "rgb("+c[0]+","+c[1]+","+c[2]+")";
  }
  function width(v){
    var t = Math.max(0, Math.min(1, (v - LO) / (HI - LO)));
    return (8 + t*92).toFixed(1) + "%";
  }
  function spreadTxt(g){
    if (g.spread == null) return "—";
    if (g.spread === 0) return "PK";
    return g.spread < 0 ? g.home.abbr+" "+fmt(g.spread) : g.away.abbr+" "+fmt(-g.spread);
  }
  function moveCls(m){ return m == null ? "flat" : (m > 0 ? "up" : (m < 0 ? "dn" : "flat")); }
  function moveTxt(m){ return m == null ? "—" : (m === 0 ? "0.0" : sgn(m)); }

  /* ===== flatten the week into one row per team ===== */
  function weekRows(){
    if (!has()) return [];
    var out = [];
    DATA.week.games.forEach(function(g){
      [g.away, g.home].forEach(function(s){
        out.push({
          abbr:s.abbr, name:s.name, color:s.color, opp:s.opp,
          implied:s.implied, open:s.open, move:s.move,
          awaiting:s.awaiting, game:g,
          home:(s === g.home)
        });
      });
    });
    // teams with no game this week
    var playing = {};
    out.forEach(function(r){ playing[r.abbr] = 1; });
    (DATA.teams||[]).forEach(function(t){
      if (!playing[t.abbr]) out.push({
        abbr:t.abbr, name:t.name, color:t.color, opp:"BYE",
        implied:null, open:null, move:null, bye:true, game:null
      });
    });
    return out;
  }

  function wSorted(){
    var rows = weekRows().slice();
    var dir = wSortDir;
    rows.sort(function(a,b){
      // byes last, then rows still waiting on a real line — regardless of direction
      if (!!a.bye !== !!b.bye) return a.bye ? 1 : -1;
      if (!a.bye && (!!a.awaiting !== !!b.awaiting)) return a.awaiting ? 1 : -1;
      if (wSortKey === "team") return (a.name < b.name ? -1 : 1) * (dir === -1 ? -1 : 1);
      if (wSortKey === "opp")  return (String(a.opp) < String(b.opp) ? -1 : 1) * (dir === -1 ? -1 : 1);
      var av = a[wSortKey], bv = b[wSortKey];
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      return dir === -1 ? bv - av : av - bv;
    });
    return rows;
  }

  /* ---- expanded detail for a week row: the game behind the number ---- */
  function weekDetailHTML(r){
    var g = r.game;
    if (!g) return '<div class="pt-detail-inner"><div class="pt-dhead">'+esc(r.name)+' — on bye in week '+esc(DATA.week.number)+'</div></div>';
    var bits = [];
    bits.push('<div><span>Kickoff</span>'+esc(g.day)+' &middot; '+esc(g.slot)+'</div>');
    bits.push('<div><span>Game total</span>'+
      (g.total_open != null && g.total !== g.total_open ? fmt(g.total_open)+' &rarr; ' : '')+
      (g.total != null ? fmt(g.total) : '—')+'</div>');
    bits.push('<div><span>Spread</span>'+esc(spreadTxt(g))+'</div>');
    bits.push('<div><span>'+esc(g.away.abbr)+'</span>'+
      (g.away.implied != null ? fmt(g.away.implied) : '—')+
      (g.away.move != null && g.away.move !== 0 ? ' <b class="pt-mv '+moveCls(g.away.move)+'">'+moveTxt(g.away.move)+'</b>' : '')+'</div>');
    bits.push('<div><span>'+esc(g.home.abbr)+'</span>'+
      (g.home.implied != null ? fmt(g.home.implied) : '—')+
      (g.home.move != null && g.home.move !== 0 ? ' <b class="pt-mv '+moveCls(g.home.move)+'">'+moveTxt(g.home.move)+'</b>' : '')+'</div>');
    return '<div class="pt-detail-inner">'+
      '<div class="pt-dhead">'+esc(g.away.name)+' at '+esc(g.home.name)+
      (g.awaiting ? ' — awaiting this week\u2019s line' : '')+'</div>'+
      '<div class="pt-gline">'+bits.join("")+'</div>'+
    '</div>';
  }

  function weekRowHTML(r, i){
    var isOpen = openWeekTeam === r.abbr;
    var cls = "tr-team" + (isOpen ? " open" : "") + (r.bye ? " byerow" : (r.awaiting ? " await" : ""));
    var val = r.bye ? "—" : (r.implied != null ? fmt(r.implied) : "—");
    var opn = r.bye || r.open == null ? "—" : fmt(r.open);
    var mv  = r.bye ? "—" : moveTxt(r.move);
    return '<tr class="'+cls+'" data-abbr="'+r.abbr+'">'+
      '<td class="tm"><button class="pt-teambtn" type="button" aria-expanded="'+isOpen+'">'+
        '<span class="pt-rank">'+(r.bye || r.awaiting ? "&middot;" : (i+1))+'</span>'+
        '<span class="pt-chip" style="background:'+r.color+'"></span>'+
        '<span class="pt-name">'+esc(r.name)+'</span>'+
        '<span class="pt-caret">&#9654;</span>'+
      '</button></td>'+
      '<td class="opp">'+(r.bye ? "BYE" : (r.home ? "vs " : "@ ")+esc(r.opp))+'</td>'+
      '<td class="big">'+val+(r.awaiting && !r.bye ? '<span class="pt-flag">OPEN</span>' : '')+'</td>'+
      '<td>'+opn+'</td>'+
      '<td><span class="pt-mv '+moveCls(r.bye ? null : r.move)+'">'+mv+'</span></td>'+
    '</tr>' +
    (isOpen ? '<tr class="pt-detail"><td colspan="5">'+weekDetailHTML(r)+'</td></tr>' : '');
  }

  /* ---- pinned band ---- */
  function pinHTML(){
    var p = DATA.pinned;
    if (!p || !p.games || !p.games.length) return "";
    var games = p.games.map(function(g){
      var final = g.completed || g.state === "post";
      var rows = [g.away, g.home].map(function(s){
        return '<div class="pt-pin-row">'+
          '<span class="pt-chip" style="background:'+s.color+'"></span>'+
          '<span class="nm">'+esc(s.name)+'</span>'+
          (final && s.score != null ? '<span class="sc">'+s.score+'</span>' : '')+
          '<span class="val">'+(s.implied != null ? fmt(s.implied) : "—")+'</span>'+
        '</div>';
      }).join("");
      return '<div class="pt-pin-g">'+rows+
        '<div class="pt-pin-ft">'+esc(g.day)+' &middot; '+esc(g.slot)+
        (final ? ' &middot; Final' : (g.state === "in" ? ' &middot; In progress' : '')) +
        (g.total != null ? ' &middot; Total '+fmt(g.total) : '')+'</div>'+
      '</div>';
    }).join("");
    return '<div class="pt-pin">'+
      '<div class="pt-pin-hd">Still from week '+esc(p.number)+
      '<span class="sub">The table below has already moved on to week '+esc(DATA.week ? DATA.week.number : "")+'</span></div>'+
      games+
    '</div>';
  }

  /* ---- matchup cards, grouped by kickoff slot ---- */
  function cardsHTML(){
    if (!has()) return "";
    var out = [], lastSlot = null;
    DATA.week.games.forEach(function(g){
      var label = g.day + " · " + g.slot;
      if (label !== lastSlot){ out.push('<div class="pt-slot">'+esc(label)+'</div>'); lastSlot = label; }
      var sides = [g.away, g.home].map(function(s, idx){
        return '<div class="pt-side">'+
          '<span class="pt-chip" style="background:'+s.color+'"></span>'+
          '<span class="nm">'+esc(s.name)+'</span>'+
          '<span class="mv pt-mv '+moveCls(s.move)+'">'+(s.move != null && s.move !== 0 ? moveTxt(s.move) : "")+'</span>'+
          '<span class="val">'+(s.implied != null ? fmt(s.implied) : "—")+'</span>'+
        '</div>';
      }).join("");
      out.push('<div class="pt-card">'+sides+
        '<div class="pt-cfoot">'+
          '<div>Total <b>'+(g.total != null ? fmt(g.total) : "—")+'</b></div>'+
          '<div>Spread <b>'+esc(spreadTxt(g))+'</b></div>'+
          (g.awaiting ? '<div>Awaiting this week\u2019s line</div>' : '')+
        '</div>'+
      '</div>');
    });
    return out.join("");
  }

  /* ---- season table (unchanged behaviour) ---- */
  function detailHTML(t){
    var rows = [];
    var byWk = {};
    var anyPlayed = false;
    t.games.forEach(function(g){ byWk[g.wk] = g; if (g.played) anyPlayed = true; });
    for (var w = 1; w <= 18; w++){
      var g = byWk[w];
      if (!g){
        rows.push('<div class="pt-bar bye"><span class="wk">W'+w+'</span>'+
          '<span class="op">BYE</span><span class="track"></span><span class="pv">—</span></div>');
        continue;
      }
      /* a played week shows what actually happened, not what was projected */
      var val = g.played ? g.score : g.pts;
      var opTxt = g.played
        ? esc(g.opp)+' '+(g.score > g.opp_score ? 'W' : g.score < g.opp_score ? 'L' : 'T')
        : esc(g.opp);
      rows.push('<div class="pt-bar'+(g.played ? ' done' : '')+'"><span class="wk">W'+w+'</span>'+
        '<span class="op">'+opTxt+'</span>'+
        '<span class="track"><span class="fill" style="width:'+width(val)+
          (g.played ? '' : ';background:'+heat(val))+'"></span></span>'+
        '<span class="pv">'+(g.played ? g.score : fmt(g.pts))+'</span></div>');
    }
    var head = esc(t.name) + ' — ';
    if (anyPlayed && t.games_left > 0 && t.ppg_rest != null){
      head += t.games_left + ' game' + (t.games_left === 1 ? '' : 's') + ' left &middot; ' +
              fmt(t.ppg_rest) + ' implied pts / game rest of season';
    } else if (t.games_left === 0){
      head += 'season complete &middot; ' + fmt(t.ppg) + ' implied pts / game';
    } else {
      head += 'implied total by week &middot; ' + fmt(t.ppg) + ' pts / game';
    }
    return '<div class="pt-detail-inner">'+
      '<div class="pt-dhead">'+head+'</div>'+
      '<div class="pt-bars">'+rows.join("")+'</div>'+
      '<div class="pt-legend"><span>Lower</span><span class="pt-ramp"></span><span>Higher</span></div>'+
      (anyPlayed ? '<div class="pt-legend res"><span class="pt-swatch"></span><span>Solid = final score</span></div>' : '')+
    '</div>';
  }

  function seasonVal(t){
    var v = t[seasonKey];
    return v == null ? t.ppg : v;    // season over -> fall back to the full-season number
  }

  function rowHTML(t, i){
    return '<tr class="tr-team'+(openTeam===t.abbr?" open":"")+'" data-abbr="'+t.abbr+'">'+
      '<td class="tm"><button class="pt-teambtn" type="button" aria-expanded="'+(openTeam===t.abbr)+'">'+
        '<span class="pt-rank">'+(i+1)+'</span>'+
        '<span class="pt-chip" style="background:'+t.color+'"></span>'+
        '<span class="pt-name">'+esc(t.name)+'</span>'+
        '<span class="pt-caret">▶</span>'+
      '</button></td>'+
      '<td class="big">'+fmt(seasonVal(t))+'</td>'+
      '<td class="po">'+fmt(t.playoff)+'</td>'+
      '<td>'+fmt(t.w15)+'</td>'+
      '<td>'+fmt(t.w16)+'</td>'+
      '<td>'+fmt(t.w17)+'</td>'+
    '</tr>' +
    (openTeam===t.abbr
      ? '<tr class="pt-detail"><td colspan="6">'+detailHTML(t)+'</td></tr>'
      : '');
  }

  function marks(table, key, dir){
    table.querySelectorAll("thead th").forEach(function(th){
      var isTeam = th.classList.contains("tm");
      var k = isTeam ? "team" : th.getAttribute("data-k");
      if (key === k){
        th.setAttribute("aria-sort", dir === -1 ? "descending" : "ascending");
        th.querySelector(".ar").textContent = dir === -1 ? "▼" : "▲";
      } else {
        th.removeAttribute("aria-sort");
      }
    });
  }

  function renderSeason(){
    var rows = DATA.teams.slice().sort(function(a,b){
      if (sortKey === "team") return (a.name < b.name ? -1 : 1) * (sortDir === -1 ? -1 : 1);
      var av = (sortKey === "ppg" || sortKey === "ppg_rest") ? seasonVal(a) : a[sortKey];
      var bv = (sortKey === "ppg" || sortKey === "ppg_rest") ? seasonVal(b) : b[sortKey];
      var d = av - bv;
      return sortDir === -1 ? -d : d;
    });
    BODY.innerHTML = rows.map(rowHTML).join("");
    marks(TABLE, sortKey, sortDir);
  }

  function renderWeek(){
    if (!WBODY) return;
    WBODY.innerHTML = wSorted().map(weekRowHTML).join("");
    marks(WTABLE, wSortKey, wSortDir);
    var p = pinHTML();
    var a = document.getElementById("ptPinWeek");
    var b = document.getElementById("ptPinGames");
    if (a) a.innerHTML = p;
    if (b) b.innerHTML = p;
    if (CARDS) CARDS.innerHTML = cardsHTML();
  }

  function setTab(t){
    tab = t;
    Object.keys(PANES).forEach(function(k){
      if (PANES[k]) PANES[k].classList.toggle("is-off", k !== t);
    });
    if (TABS) TABS.querySelectorAll(".pt-tab").forEach(function(b){
      b.classList.toggle("is-on", b.getAttribute("data-tab") === t);
    });
  }

  /* ---- interactions ---- */
  if (TABS) TABS.addEventListener("click", function(e){
    var b = e.target.closest(".pt-tab");
    if (b) setTab(b.getAttribute("data-tab"));
  });

  TABLE.querySelectorAll("thead th").forEach(function(th){
    th.querySelector(".pt-sortbtn").addEventListener("click", function(){
      var k = th.classList.contains("tm") ? "team" : th.getAttribute("data-k");
      if (sortKey === k) sortDir = -sortDir;
      else { sortKey = k; sortDir = (k === "team") ? 1 : -1; }
      renderSeason();
    });
  });

  if (WTABLE) WTABLE.querySelectorAll("thead th").forEach(function(th){
    th.querySelector(".pt-sortbtn").addEventListener("click", function(){
      var k = th.classList.contains("tm") ? "team" : th.getAttribute("data-k");
      if (wSortKey === k) wSortDir = -wSortDir;
      else { wSortKey = k; wSortDir = (k === "team" || k === "opp") ? 1 : -1; }
      renderWeek();
    });
  });

  BODY.addEventListener("click", function(e){
    var btn = e.target.closest(".pt-teambtn");
    if (!btn) return;
    var abbr = btn.closest("tr").getAttribute("data-abbr");
    openTeam = (openTeam === abbr) ? null : abbr;
    renderSeason();
  });

  if (WBODY) WBODY.addEventListener("click", function(e){
    var btn = e.target.closest(".pt-teambtn");
    if (!btn) return;
    var abbr = btn.closest("tr").getAttribute("data-abbr");
    openWeekTeam = (openWeekTeam === abbr) ? null : abbr;
    renderWeek();
  });

  /* ---- boot: markup is already correct; only re-render on live data ---- */
  if (DATA_URL && typeof fetch === "function"){
    try{
      fetch(DATA_URL,{cache:"no-store"}).then(function(r){return r.json();}).then(function(j){
        if (!j || !j.teams || j.teams.length !== 32) return;
        var wasInSeason = has();
        DATA = j;
        var u = document.getElementById("ptUpdated");
        if (u && j.updated) u.textContent = "Updated " + j.updated;
        var tl = document.getElementById("ptTabWeek");
        if (tl && j.week) tl.textContent = "Week " + j.week.number;
        var sub = document.getElementById("ptSub");
        if (sub && j.week) sub.textContent =
          "Projected points for every team in week " + j.week.number +
          " — straight from the sportsbook lines, with the week\u2019s opening number and the move since.";
        // the feed can flip in or out of season between page load and fetch
        if (TABS) TABS.classList.toggle("is-off", !has());
        if (!has() && tab !== "season") setTab("season");
        if (has() && !wasInSeason) setTab("week");

        /* once games have been played the headline season column becomes the
           rest-of-season average — relabel the header to match */
        var anyLeft = (j.teams || []).some(function(t){ return t.ppg_rest != null && t.games_left < 17; });
        var newKey = anyLeft ? "ppg_rest" : "ppg";
        if (newKey !== seasonKey){
          if (sortKey === seasonKey) sortKey = newKey;
          seasonKey = newKey;
          var th = document.getElementById("ptThPpg");
          if (th){
            th.setAttribute("data-k", newKey);
            var btn = th.querySelector(".pt-sortbtn");
            var ar = btn.querySelector(".ar");
            btn.textContent = (newKey === "ppg_rest" ? "Rest of Season" : "Pts / Game") + " ";
            btn.appendChild(ar);
          }
        }
        renderSeason();
        renderWeek();
      }).catch(function(){});    // unreachable/bad JSON -> keep pre-rendered lines
    }catch(e){}
  }
})();
</script>
